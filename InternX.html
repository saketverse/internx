function checkReq(q,p){
 if(!q.m)return{o:'Preferred',n:'Informational only — never disqualifying.',c:'wn'};

function relevance(i,p){const c=[];const sk=i.r.filter(q=>q.k==='skill');
 if(sk.length&&(p.skills||[]).length)c.push([.4,sk.filter(q=>has(q.x)).length/sk.length,'skills']);
 if((p.interests||[]).length)c.push([.25,p.interests.includes(i.f)?1:0,'field']);
 if(p.avail)c.push([.2,/week|full|any|flex/i.test(p.avail)?1:.5,'availability']);
 if(p.mode||p.loc)c.push([.15,(!p.mode||p.mode===i.m||p.mode==='Any')?1:0,'work mode']);
 if(!c.length)return{s:null,why:['Complete your profile to see a relevance score.']};
 const w=c.reduce((a,x)=>a+x[0],0),s=Math.round(c.reduce((a,x)=>a+x[0]*x[1],0)/w*100),why=[];
 sk.forEach(q=>why.push(has(q.x)?`Your reported ${q.x} skill matches a role requirement.`:`${q.x} is listed, but your profile does not confirm it.`));
 if(p.interests?.length)why.push(p.interests.includes(i.f)?`Matches your interest in ${i.f}.`:`${i.f} is not among your interests.`);
 if(i.dl===null)why.push('Deadline unknown. Check the official source.');
 return{s,why,used:c.map(x=>x[2])}}

function suggest(i){const t=[],p=S.p;

 return t}

 <div class="card" style="margin-top:14px"><h3>How InternX stays honest</h3><p class="mut">Mandatory and preferred requirements are kept apart. Unknown information is shown as unknown. Relevance scores are not selection probabilities.</p></div>`},
internships(){return `<h1>Internship Radar</h1><div class="card"><div class="row"><div><label for="q">Search</label><input id="q" value="${esc(F.q)}" oninput="setF('q',this.value)" placeholder="Role, skill, field…"></div>
 <div><label for="f">Field</label><select id="f" onchange="setF('f',this.value)"><option value="">All</option>${opt(['Software','Data','Marketing'],F.f)}</select></div>
 <div><label for="m">Work mode</label><select id="m" onchange="setF('m',this.value)"><option value="">All</option>${opt(['Remote','Hybrid','On-site'],F.m)}</select></div>
 <div><label for="e">Eligibility</label><select id="e" onchange="setF('e',this.value)"><option value="">All</option>${opt(['Meets known requirements','Needs confirmation','Does not meet a known requirement'],F.e)}</select></div>
 <div><label for="s">Sort</label><select id="s" onchange="setF('sort',this.value)"><option value="rel" ${F.sort==='rel'?'selected':''}>Relevance</option><option value="dl" ${F.sort==='dl'?'selected':''}>Deadline</option><option value="chk" ${F.sort==='chk'?'selected':''}>Recently checked</option></select></div>
 <label style="margin-top:20px"><input type="checkbox" ${F.saved?'checked':''} onchange="setF('saved',this.checked)"> Saved only</label><button class="btn s" style="margin-top:14px" onclick="clearF()">Clear all</button></div></div><div id="res">${list()}</div>`},
detail(id){const i=byId(id);if(!i)return notFound();const e=eligibility(i,S.p),r=relevance(i,S.p);
 return `<a href="#/internships">← Back to results</a><div class="card" style="margin-top:10px">${badge('Demo Data — Not a verified live opening','wn')}<h1 style="margin-top:8px">${esc(i.t)}</h1><div class="mut">${esc(i.o)} · ${esc(i.f)} · ${esc(i.m)}, ${esc(i.loc)} · ${esc(i.dur)}</div>
 <p>${esc(i.d)}</p><p><b>Responsibilities:</b> ${i.resp.map(esc).join('; ')}</p><p><b>Stipend:</b> ${esc(i.st||'Unknown')} · <b>Deadline:</b> ${i.dl?esc(i.dl)+' ('+esc(i.dt)+')':'Unknown'} · <b>Status:</b> ${esc(i.stat)}</p>
 <p><b>Documents:</b> ${i.docs.map(esc).join(', ')} · <b>Selection stages:</b> not documented</p><p class="mut">Official source: none — this is a fictional sample record, so no application link is available. Last checked ${esc(i.chk)}. Real listings need a source URL.</p>
 <div class="row"><button class="btn" onclick="addRoadmap('${i.id}')">Add to roadmap</button><button class="btn s" onclick="track('${i.id}')">Add to tracker</button><button class="btn s" onclick="toggleSave('${i.id}')">${S.saved.includes(i.id)?'Remove saved':'Save'}</button><button class="btn s" disabled>No official link</button></div></div>
 <div class="card" style="margin-top:14px"><h2>Eligibility analysis</h2><p>${badge(e.st,e.c)} ${r.s!==null?badge('Relevance '+r.s+'/100 (not a selection probability)'):''}</p>
 ${e.rs.map(x=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><b>${esc(x.q.x)}</b> ${badge(x.q.m?'Mandatory':'Preferred')} ${badge(x.o,x.c)}<div class="mut">${esc(x.n)}</div></div>`).join('')}
 <p class="mut">Tip: confirm anything marked "Needs confirmation" with the official source.</p>${r.why.map(w=>`<div class="mut">• ${esc(w)}</div>`).join('')}</div>`},
roadmap(){const T=S.tasks,done=T.filter(t=>t.status==='Completed').length,pc=T.length?Math.round(done/T.length*100):0;
 return `<h1>Personalized Roadmap</h1><div class="card"><b>${pc}% complete</b> <span class="mut">(${done}/${T.length} tasks)</span><div class="bar" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div></div>
 <div class="card" style="margin-top:12px"><div class="row"><div><label for="nt">New task</label><input id="nt" placeholder="Task title"></div><div><label for="ni">Internship</label><select id="ni"><option value="">None</option>${D.map(i=>`<option value="${i.id}">${esc(i.t)}</option>`).join('')}</select></div><button class="btn" style="margin-top:20px" onclick="addTask()">Create</button></div></div>
 ${T.length?`<div class="grid" style="margin-top:12px">${T.map(t=>`<div class="card"><b>${esc(t.title)}</b><div class="mut">${t.iid?esc(byId(t.iid).t):'General'} · Priority ${esc(t.priority||'Medium')}</div><p class="mut">${esc(t.reason||t.description||'Added by you')}</p>
 <div class="row"><select aria-label="Status" onchange="upT('${t.id}','status',this.value)">${opt(TS,t.status)}</select><input type="date" aria-label="Due date" value="${esc(t.due)}" onchange="upT('${t.id}','due',this.value)"><button class="btn s" onclick="delT('${t.id}',this)">Delete</button></div></div>`).join('')}</div>`:`<div class="card" style="margin-top:12px">No tasks yet. <a href="#/internships">Explore internships</a>, open one and choose "Add to roadmap".</div>`}`},
applications(){const A=S.apps;
 return `<h1>Application Command Center</h1><p class="mut">Stages are your own records, not confirmation from any employer.</p>${A.length?`<div class="cols">${ST.map(s=>`<div class="col"><h3>${s} (${A.filter(a=>a.stage===s).length})</h3>${A.filter(a=>a.stage===s).map(a=>{const i=byId(a.iid);return `<div class="card" style="margin-bottom:10px"><a href="#/internships/${a.iid}"><b>${esc(i.t)}</b></a><div class="mut">${esc(i.o)} · Deadline ${esc(i.dl||'unknown')}</div>
 <label>Stage</label><select onchange="upA('${a.id}','stage',this.value)">${opt(ST,a.stage)}</select>
 ${a.stage==='Outcome'?`<label>Outcome</label><select onchange="upA('${a.id}','outcome',this.value)">${opt(['Not recorded','Selected','Rejected','Withdrawn','Other'],a.outcome||'Not recorded')}</select>`:''}
 <label>Next action</label><input value="${esc(a.next)}" onchange="upA('${a.id}','next',this.value)"><label>Notes</label><textarea rows="2" style="width:100%" onchange="upA('${a.id}','notes',this.value)">${esc(a.notes)}</textarea>
 <div class="mut">Updated ${new Date(a.upd).toLocaleString()}</div><button class="btn s" style="margin-top:6px" onclick="delA('${a.id}',this)">Delete</button></div>`}).join('')}</div>`).join('')}</div>`:`<div class="card">No applications yet. Open an <a href="#/internships">internship</a> and choose "Add to tracker".</div>`}`},
profile(){const p=S.p;return `<h1>Profile</h1><p class="mut">This data drives eligibility checks and relevance scores. Everything is optional; missing facts stay "unknown". Stored only in this browser.</p><div class="card" style="max-width:560px">
 <label for="c">Course</label><input id="c" value="${esc(p.course)}"><label for="y">Current academic year (1–6)</label><input id="y" type="number" min="1" max="6" value="${esc(p.year)}"><label for="g">Graduation year</label><input id="g" type="number" min="2024" max="2035" value="${esc(p.grad)}">
 <label for="sk">Skills (comma-separated)</label><input id="sk" style="width:100%" value="${esc((p.skills||[]).join(', '))}"><label for="in">Interest fields</label><select id="in" multiple>${['Software','Data','Marketing'].map(x=>`<option ${(p.interests||[]).includes(x)?'selected':''}>${x}</option>`).join('')}</select>
 <label for="pm">Preferred work mode</label><select id="pm"><option value="">No preference</option>${opt(['Remote','Hybrid','On-site'],p.mode)}</select><label for="av">Availability</label><input id="av" placeholder="e.g. weekdays, flexible" value="${esc(p.avail)}">
 <div class="row" style="margin-top:14px"><button class="btn" onclick="saveP()">Save profile</button><button class="btn s" onclick="wipe(this)">Delete all my data</button></div></div>`}};
function notFound(){return `<h1>Page not found</h1><a href="#/">Go home</a>`}
function saveP(){const y=+$('#y').value,g=+$('#g').value;if(y&&(y<1||y>6))return toast('Year must be 1–6');
 S.p={course:$('#c').value.trim(),year:y||'',grad:g||'',skills:$('#sk').value.split(',').map(s=>s.trim()).filter(Boolean),interests:[...$('#in').selectedOptions].map(o=>o.value),mode:$('#pm').value,avail:$('#av').value.trim()};save();toast('Profile saved')}
function addTask(){const t=$('#nt').value.trim();if(!t)return toast('Enter a title');S.tasks.push({id:uid(),iid:$('#ni').value,title:t,description:'',reason:'Added by you',priority:'Medium',status:'Not started',due:''});save();route()}
function upT(id,k,v){S.tasks.find(t=>t.id===id)[k]=v;save();if(k==='status')route()}
function upA(id,k,v){const a=S.apps.find(x=>x.id===id);a[k]=v;a.upd=nowS();save();if(k==='stage')route()}
function confirmBtn(b,fn){if(b.dataset.c){fn();return}b.dataset.c=1;b.textContent='Confirm delete?';b.className='btn d';setTimeout(()=>{b.dataset.c='';b.textContent='Delete';b.className='btn s'},3000)}
function delT(id,b){confirmBtn(b,()=>{S.tasks=S.tasks.filter(t=>t.id!==id);save();route()})}
function delA(id,b){confirmBtn(b,()=>{S.apps=S.apps.filter(t=>t.id!==id);save();route()})}
function wipe(b){confirmBtn(b,()=>{S={p:{skills:[],interests:[]},saved:[],apps:[],tasks:[]};save();toast('Local data deleted');route()})}
function route(){const h=location.hash.slice(2)||'',[a,b]=h.split('/');let v;
 v=a===''?views.home():a==='internships'?(b?views.detail(b):views.internships()):views[a]?views[a]():notFound();
 $('#app').innerHTML=v;document.querySelectorAll('nav a.n').forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#/'+(a||'')))}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
</script></body></html>
